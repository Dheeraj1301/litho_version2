<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adaptive Lithography AI</title>
    <style>
      body {
        margin: 0;
        background: linear-gradient(135deg, #f1f5f9, #eff6ff, #e0e7ff);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
      }
      .boot-card {
        width: min(720px, 100%);
        border: 1px solid #bfdbfe;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.12);
        padding: 32px;
      }
      .boot-card h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.15;
      }
      .boot-card p {
        margin: 12px 0 0;
        color: #475569;
      }
      .boot-card noscript p {
        color: #b91c1c;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-shell">
        <section class="boot-card">
          <h1>🧠 Computational Lithography AI</h1>
          <p>Loading the frontend dashboard…</p>
          <noscript>
            <p>JavaScript is disabled. Please enable JavaScript to use the frontend.</p>
          </noscript>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
